name: Smoke Official Venue Adapters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openreview-v2:
    name: OpenReview v2 connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector
        run: python -m pip install .

      - name: Fetch one public OpenReview v2 note
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        run: |
          python - <<'PY'
          from llm_security_digest.papers.openreview_client import OpenReviewClientFactory

          client = OpenReviewClientFactory.from_env().get("v2")
          notes = client.get_notes(
              content={"venueid": "ICLR.cc/2025/Conference"},
              limit=1,
              offset=0,
              details="replies",
          )
          if not notes:
              raise SystemExit("OpenReview v2 returned no public notes")
          note = notes[0]
          note_id = getattr(note, "id", None) or (note.get("id") if isinstance(note, dict) else None)
          if not isinstance(note_id, str) or not note_id:
              raise SystemExit("OpenReview v2 response has no note id")
          PY

  smoke:
    name: ${{ matrix.source }} / ${{ matrix.venue }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: official
            venue: usenix-security
          - source: official
            venue: ndss
          - source: official
            venue: neurips
          - source: official
            venue: icml
          - source: official
            venue: cvpr
          - source: official
            venue: eccv
          - source: official
            venue: acl
          - source: official
            venue: emnlp
          - source: official
            venue: aaai
          - source: official
            venue: ijcai
          - source: official
            venue: ieee-sp
          - source: crossref
            venue: ieee-sp
            sample_doi: 10.1109/sp.1984.10021
          - source: crossref
            venue: acm-ccs
            sample_doi: 10.1145/3658644.3690227
          - source: crossref
            venue: tdsc
            sample_doi: 10.1109/tdsc.2024.3371788
          - source: crossref
            venue: tifs
            sample_doi: 10.1109/tifs.2010.2098873
          - source: crossref
            venue: tops
            sample_doi: 10.1145/3546579
          - source: openreview
            venue: iclr
            openreview_venue: ICLR.cc/2025/Conference
          - source: arxiv
            venue: arxiv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector and bounded browser fallback
        run: |
          python -m pip install . playwright
          python -m playwright install --with-deps chromium

      - name: Collect one official record and validate its report
        env:
          VENUE: ${{ matrix.venue }}
          SAMPLE_DOI: ${{ matrix.sample_doi }}
          SOURCE: ${{ matrix.source }}
          OPENREVIEW_VENUE: ${{ matrix.openreview_venue }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          LLMSD_HEADLESS_FALLBACK: "1"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          venue = os.environ["VENUE"]
          source = os.environ["SOURCE"]
          openreview_venue = os.environ.get("OPENREVIEW_VENUE", "").strip()
          work = Path(".smoke")
          work.mkdir()
          plan = {
              "queries": ["LLM security"],
              "sources": [source],
              "venue_groups": [venue] if source in {"official", "crossref"} else [],
              "openreview_venues": [openreview_venue] if source == "openreview" and openreview_venue else [],
              # Crossref deposits use DOI/container/ISSN metadata and are
              # not tied to an annual endpoint. Keep its smoke query
              # cross-year so a current deposit can exercise the filter.
              "date_from": None if source in {"crossref", "openreview"} else "2024-01-01",
              "date_to": None if source in {"crossref", "openreview"} else "2024-12-31",
              "max_results_per_query": 1,
              "max_results_per_venue": 1,
              "target": 10,
              "scholar_enrich_limit": 0,
          }
          (work / "plan.json").write_text(json.dumps(plan), encoding="utf-8")
          PY
          collect_status=0
          python scripts/llm_security/run_daily.py collect \
            --plan .smoke/plan.json \
            --out .smoke/candidates.json \
            --data-dir .smoke/data || collect_status=$?
          if [ "$collect_status" -ne 0 ] && [ "$collect_status" -ne 3 ]; then
            exit "$collect_status"
          fi
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          venue = os.environ["VENUE"]
          payload = json.loads(Path(".smoke/candidates.json").read_text(encoding="utf-8"))
          report_venue = os.environ.get("OPENREVIEW_VENUE", "").strip() if os.environ["SOURCE"] == "openreview" else venue
          reports = [
              report for report in payload.get("source_reports", [])
              if report.get("source") == os.environ["SOURCE"]
              and report.get("adapter") != "summary"
              and (os.environ["SOURCE"] == "arxiv" or report.get("venue_group") == report_venue)
          ]
          if len(reports) != 1:
              raise SystemExit(f"expected exactly one source report for {report_venue}, got {len(reports)}")
          report = reports[0]
          source = os.environ["SOURCE"]
          if source in {"official", "openreview", "arxiv"}:
              passed = (
                  report.get("status") in {"ok", "partial"}
                  and report.get("requests_succeeded", 0) >= 1
                  and report.get("records_valid", 0) >= 1
              )
          else:
              # Crossref is a registered metadata query. It can correctly
              # reject every bounded result as incomplete; the smoke asserts
              # that the API request and venue/container filter ran, without
              # requiring a materializable record from a keyword hit.
              classified = sum(
                  report.get(field, 0)
                  for field in ("records_valid", "records_filtered", "records_incomplete")
              )
              passed = (
                  report.get("status") in {"ok", "partial"}
                  and report.get("requests_succeeded", 0) >= 1
                  and report.get("requests_failed", 0) == 0
                  and not report.get("errors")
                  and report.get("records_scanned", 0) >= 1
                  and classified >= 1
              )
          if not passed:
              print(json.dumps(report, ensure_ascii=False, indent=2), file=sys.stderr)
              raise SystemExit(f"{source} adapter smoke failed for {venue}")
          PY

      - name: Refresh one record and validate authoritative BibTeX
        env:
          SOURCE: ${{ matrix.source }}
          VENUE: ${{ matrix.venue }}
          SAMPLE_DOI: ${{ matrix.sample_doi }}
          OPENREVIEW_VENUE: ${{ matrix.openreview_venue }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          LLMSD_HEADLESS_FALLBACK: "1"
        run: |
          args=(
            --candidates .smoke/candidates.json
            --source "$SOURCE"
            --venue "$VENUE"
          )
          if [ -n "${SAMPLE_DOI:-}" ]; then
            args+=(--sample-doi "$SAMPLE_DOI")
          fi
          if [ "$SOURCE" = "openreview" ]; then
            args+=(--openreview-venue "$OPENREVIEW_VENUE")
          fi
          python scripts/llm_security/smoke_venue_adapter.py "${args[@]}"
