[project]
name = "llm-security-digest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "Markdown>=3.6,<4",
    "python-frontmatter>=1.1,<2",
    "openreview-py>=1.46,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_security_digest"]
